name: "metropulse"
version: "1.0.0"
config-version: 2

profile: "metropulse"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  min_pickup_timestamp: "2024-04-01 00:00:00"
  max_pickup_timestamp: "2024-06-30 23:59:59"
  min_duration_seconds: 60
  max_duration_minutes: 360
  min_distance_miles: 0.1
  max_distance_miles: 100.0
  max_speed_mph: 85.0
  min_fare_amount: 3.00
  max_fare_amount: 500.00
  min_total_amount: 3.00
  max_total_amount: 1000.00
  min_passenger_count: 1
  max_passenger_count: 6

models:
  metropulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
