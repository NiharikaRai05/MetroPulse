[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metropulse"
version = "0.1.0"
description = "NYC Mobility Analytics Platform (Apr-Jun 2024)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MetroPulse Team" }
]
dependencies = [
    "duckdb>=1.0.0",
    "dbt-duckdb>=1.8.0",
    "dbt-core>=1.8.0",
    "requests>=2.31.0",
    "tenacity>=8.3.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pydeck>=0.9.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "analysis*", "export*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
